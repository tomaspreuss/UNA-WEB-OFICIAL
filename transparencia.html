<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transparencia — Unión Nacional de Artistas</title>
  <link rel="icon" href="assets/img/logo-una.png" type="image/png">

  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#000000" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Switzer','system-ui','sans-serif'] },
          animation: { spinSlower: 'spin 24s linear infinite' }
        }
      }
    }
  </script>

  <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700,800,900&display=swap" rel="stylesheet">
  <style>
    html, body { background:#000000 !important; color:#FFFFFF; }
    html { scroll-behavior:smooth; }
    
    /* Responsive fixes: Hide sol below 810px */
    @media (max-width: 810px) {
      .animate-spinSlower {
        display: none !important;
      }
    }

    @media (max-width: 644px) {
      header nav .group.flex.items-center {
        gap: 4px !important; 
      }
      header nav .group span {
        font-size: 10px !important; 
        letter-spacing: 0.02em !important;
      }
      header nav .flex.items-center.gap-6 {
        gap: 0.75rem !important; /* 12px */
      }
      header nav .flex.items-center.gap-6 a {
        font-size: 9px !important;
      }
    }
  </style>
</head>

<body class="bg-black font-sans antialiased" id="top">
  <!-- NAVBAR -->
  <header class="sticky top-0 z-50 bg-black text-white border-b border-white/10">
    <nav class="max-w-7xl mx-auto px-6 sm:px-8" style="font-family:'Switzer','system-ui','sans-serif;">
      <div class="h-16 flex items-center justify-between">
        <a href="index.html#top" class="group flex items-center gap-2 sm:gap-3">
          <span class="tracking-wide font-black text-[12px] sm:text-sm select-none uppercase">UNIÓN NACIONAL DE ARTISTAS</span>
          <img src="assets/img/logo-una.png" alt="Sol UNA" class="h-5 w-5 sm:h-6 sm:w-6 animate-spinSlower" />
        </a>

        <div class="flex items-center gap-6">
          <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-[10px] sm:text-[11px] font-semibold uppercase tracking-wide text-white/90">
            <a href="index.html#top" class="hover:text-white transition">Inicio</a>
            <a href="somos.html" class="hover:text-white transition">Somos</a>
            <a href="actividades.html" class="hover:text-white transition">Actividades</a>
            <a href="index.html#revista" class="hover:text-white transition">Revista</a>
            <a href="index.html#contacto" class="hover:text-white transition">Contacto</a>
          </div>

          <div class="hidden sm:block h-4 w-px bg-white/30"></div>

          <div class="hidden sm:flex items-center gap-4 text-white/90">
            <a href="https://web.facebook.com/artistasuna" target="_blank" rel="noopener" aria-label="Facebook" class="hover:text-white transition">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
              </svg>
            </a>
            <a href="https://www.instagram.com/una.artistas/" target="_blank" rel="noopener" aria-label="Instagram" class="hover:text-white transition">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
              </svg>
            </a>
            <a href="mailto:contacto@unionnacionaldeartistas.cl" aria-label="Mail" class="hover:text-white transition">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="14" rx="2" ry="2"/>
                <polyline points="3 7 12 13 21 7"/>
              </svg>
            </a>
            <a href="https://x.com/artistasuna" target="_blank" rel="noopener" aria-label="X" class="hover:text-white transition">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4l16 16"/><path d="M20 4 4 20"/>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="w-full bg-black min-h-screen">
      <div class="max-w-5xl mx-auto px-6 py-24">
        <h1 class="text-3xl sm:text-4xl font-black tracking-wide uppercase mb-8" style="font-family:'Recia','Switzer','system-ui',sans-serif;">
          Transparencia
        </h1>
        <div class="max-w-3xl">
          <div class="grid gap-4">

            <!-- Memoria 2024 -->
            <div class="border border-white/20 rounded-xl overflow-hidden transition-all duration-300 hover:bg-white/5 group">
              <button onclick="document.getElementById('pdf-viewer-memoria-2024').classList.toggle('hidden')" class="w-full flex items-center justify-between p-6 text-left focus:outline-none">
                <div class="flex items-center gap-5">
                  <div class="bg-white/10 p-3 rounded-lg group-hover:bg-white/20 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                  </div>
                  <div>
                    <h3 class="text-lg font-bold text-white mb-1 group-hover:text-[#7F2D87] transition-colors">Memoria 2024</h3>
                    <p class="text-xs uppercase tracking-wider text-gray-400">Clic para desplegar</p>
                  </div>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-500 group-hover:text-white transition-colors transform group-hover:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                </svg>
              </button>
              
              <!-- Visor PDF -->
              <div id="pdf-viewer-memoria-2024" class="hidden border-t border-white/10 bg-black/50">
                <div class="p-2 flex justify-end bg-white/5">
                    <a href="assets/documentos/transparencia/Memoria%202024-%20UNA%20.pdf" target="_blank" class="text-xs font-bold uppercase tracking-wider text-gray-400 hover:text-white flex items-center gap-2 px-4 py-2">
                        Abrir en nueva pestaña
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                        </svg>
                    </a>
                </div>
                <iframe src="assets/documentos/transparencia/Memoria%202024-%20UNA%20.pdf" class="w-full h-[80vh] bg-white" title="Memoria 2024"></iframe>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
